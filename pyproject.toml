[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stack-overflow-analyzer"
version = "0.1.0"
description = "Deterministic Stack Overflow contributor analytics with evidence-grounded LLM narratives"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "openai>=1.99.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "sqlalchemy[asyncio]>=2.0.41",
  "structlog>=25.4.0",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "pre-commit>=4.2.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "respx>=0.22.0",
  "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stack_overflow_analyzer"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".test-tmp*", ".venv*", ".uv-cache*", ".pre-commit-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]
