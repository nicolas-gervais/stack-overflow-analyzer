repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
      - id: ruff-lint
        name: Ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: pytest
        name: Full test suite
        entry: uv run pytest
        language: system
        pass_filenames: false
